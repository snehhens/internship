<ion-content>

  <ion-input
    placeholder="Email"
    [(ngModel)]="form.email">
  </ion-input>

  <ion-input
    type="password"
    placeholder="Password"
    [(ngModel)]="form.password">
  </ion-input>

  <ion-button
    expand="block"
    (click)="createPassword()">

    Create Password

  </ion-button>

</ion-content>
