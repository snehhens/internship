<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      [value]="form.email"
      readonly="true">
    </ion-input>
  </ion-item>

  <div class="otp-container">

    <ion-input-otp
      [(ngModel)]="form.otp"
      length="4">
    </ion-input-otp>

  </div>

  <ion-button
    expand="block"
    (click)="verifyOtp()">

    Verify OTP

  </ion-button>

</ion-content>
